<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ZETA SCALPER AI — Gizmo Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="./assets/avatar.png" type="image/png" />
  </head>
  <body>
    <div class="phone">
      <div class="glow" aria-hidden="true"></div>
      <div class="glow glow-soft" aria-hidden="true"></div>

      <header class="top">
        <p class="username" id="username"></p>
      </header>

      <main class="stage">
        <div class="hero">
          <div class="avatar-wrap">
            <img
              class="avatar"
              src="./assets/avatar.png"
              alt="Zeta Scalper AI avatar"
              width="160"
              height="160"
            />
          </div>
          <p class="kicker">You are trading with</p>
          <h1 class="brand">ZETA SCALPER AI</h1>
          <p class="powered">POWERED BY GIZMO PRO</p>
        </div>

        <div class="controls" role="group" aria-label="Trading controls">
          <button class="control" type="button" data-action="remove">
            <span class="control-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M9 4h6m-8 3h10m-1.5 0-.7 11.2a1.5 1.5 0 0 1-1.5 1.4H9.7a1.5 1.5 0 0 1-1.5-1.4L7.5 7m3 3v10m3-10v10"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="control-label">REMOVE</span>
          </button>

          <button class="control control-primary" type="button" data-action="start">
            <span class="control-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M9 7.5v9l8-4.5-8-4.5Z" fill="currentColor" />
              </svg>
            </span>
            <span class="control-label">START</span>
          </button>

          <button class="control" type="button" data-action="quotes">
            <span class="control-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M8 7h11M8 12h11M8 17h11M5 7h.01M5 12h.01M5 17h.01"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="control-label">QUOTES</span>
          </button>
        </div>

        <section class="robots" aria-label="Robot list">
          <h2 class="robots-title">ROBOT LIST:</h2>
          <button class="robot-row is-active" type="button" data-bot="zeta">
            <img src="./assets/avatar.png" alt="" width="36" height="36" />
            <span>ZETA SCALPER AI</span>
            <span class="check" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="m6.5 12.5 3.5 3.5 7.5-8"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>
          <button class="robot-row robot-add" type="button" data-action="add-bot">
            <span class="plus" aria-hidden="true">+</span>
            <span>Add New Trading Bot</span>
          </button>
        </section>
      </main>

      <nav class="tabbar" aria-label="Primary">
        <button class="tab is-active" type="button" data-tab="home">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4.5 10.5 12 4l7.5 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-4v6H5.5a1 1 0 0 1-1-1v-9.5Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
          <span>Home</span>
        </button>
        <button class="tab" type="button" data-tab="scanner">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M7 4H5.5A1.5 1.5 0 0 0 4 5.5V7m16 0V5.5A1.5 1.5 0 0 0 18.5 4H17M7 20H5.5A1.5 1.5 0 0 1 4 18.5V17m16 0v1.5a1.5 1.5 0 0 1-1.5 1.5H17M8 12h8"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <span>Scanner</span>
        </button>
        <button class="tab" type="button" data-tab="metatrader">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4 16.5 8.5 12l3.5 3.5L20 7.5M14.5 7.5H20V13"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>MetaTrader</span>
        </button>
      </nav>

      <div class="toast" id="toast" hidden></div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
