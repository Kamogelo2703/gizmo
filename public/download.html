<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>apex-ea — Download</title>
    <meta name="description" content="Download the apex-ea Android app" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:title" content="apex-ea" />
    <meta property="og:description" content="Download the apex-ea Android app" />
    <meta property="og:image" content="/logo.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a0010;
        --pink: #ff2d6a;
        --text: #fff7fb;
        --muted: rgba(255, 247, 251, 0.72);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 45, 106, 0.28), transparent 42%),
          linear-gradient(180deg, #2a0418 0%, var(--bg) 55%, #0c0008 100%);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
      }
      .card {
        width: min(100%, 420px);
        text-align: center;
      }
      .logo-wrap {
        width: min(72vw, 220px);
        aspect-ratio: 1;
        margin: 0 auto 22px;
        border-radius: 28px;
        overflow: hidden;
        background: #fff;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .logo-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 2.6rem);
        letter-spacing: 0.04em;
        font-weight: 800;
      }
      p {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.45;
      }
      .actions {
        margin-top: 28px;
        display: grid;
        gap: 12px;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 54px;
        padding: 0 22px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      a.btn-primary {
        color: #fff;
        background: linear-gradient(180deg, #ff4d7d 0%, #c01048 100%);
        box-shadow: 0 14px 30px rgba(255, 45, 106, 0.35);
      }
      a.btn-ghost {
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
      }
      .note {
        margin-top: 18px;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-label="apex-ea download">
        <div class="logo-wrap">
          <img src="/logo.png" width="220" height="220" alt="apex-ea logo" />
        </div>
        <h1>apex-ea</h1>
        <p>Android app download. Install the APK to open the trading client.</p>
        <div class="actions">
          <a class="btn btn-primary" id="download" href="/apex-ea.apk" download="apex-ea.apk">
            Download apex-ea
          </a>
          <a class="btn btn-ghost" href="/">Back to app</a>
        </div>
        <p class="note">File name: <strong>apex-ea.apk</strong></p>
      </section>
    </main>
    <script>
      // Auto-start download on phones so the branded page stays visible.
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get("auto") === "0") return;
        var link = document.getElementById("download");
        if (!link) return;
        window.setTimeout(function () {
          link.click();
        }, 450);
      })();
    </script>
  </body>
</html>
